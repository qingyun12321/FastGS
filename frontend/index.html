<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastGS - 魔芯科技 KOKONI</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        background: #0f1218;
        color: #e6e9ef;
      }

      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        gap: 16px;
        flex-wrap: wrap;
      }

      .brand-title {
        font-size: 28px;
        font-weight: 700;
      }

      .brand-sub {
        font-size: 18px;
        opacity: 0.8;
      }

      .content {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 16px;
      }

      .card {
        background: #171c25;
        border: 1px solid #242b39;
        border-radius: 12px;
        padding: 16px;
        min-height: 180px;
      }

      .card h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }

      .row label {
        min-width: 140px;
        font-size: 14px;
      }

      input,
      button,
      textarea {
        background: #10141c;
        color: #e6e9ef;
        border: 1px solid #2f3747;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 14px;
      }

      input[type="checkbox"] {
        width: auto;
      }

      input[type="file"] {
        max-width: 220px;
      }

      button {
        cursor: pointer;
      }

      .primary {
        background: #3a7afe;
        border-color: #3a7afe;
        color: #fff;
      }

      .status {
        font-size: 12px;
        opacity: 0.9;
      }

      #logBox {
        width: 100%;
        height: 180px;
        margin-top: 8px;
        resize: vertical;
        white-space: pre-wrap;
      }

      progress {
        width: 100%;
        height: 10px;
        border-radius: 6px;
        overflow: hidden;
      }

      .hint {
        font-size: 12px;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="brand">
          <div class="brand-title">魔芯科技</div>
          <div class="brand-sub">KOKONI · FastGS</div>
        </div>
      </header>

      <main class="content">
        <section class="card">
          <h2>数据集</h2>
          <div class="row">
            <label>上传数据集（zip）</label>
            <input id="datasetZip" type="file" accept=".zip" />
            <button id="uploadDatasetBtn">上传</button>
            <span id="datasetUploadStatus" class="status"></span>
          </div>
          <div class="row">
            <progress id="datasetProgress" value="0" max="100"></progress>
          </div>
        </section>

        <section class="card">
          <h2>模型输入</h2>
          <div class="row">
            <label>上传已训练模型（zip）</label>
            <input id="modelZip" type="file" accept=".zip" />
            <button id="uploadModelBtn">上传</button>
            <span id="modelUploadStatus" class="status"></span>
          </div>
          <div class="row">
            <label>
              <input id="renderOnly" type="checkbox" />
              不训练，仅渲染
            </label>
          </div>
          <div class="row hint">render_only 模式会使用上传模型或已有输出目录。</div>
        </section>

        <section class="card">
          <h2>渲染选项</h2>
          <div class="row">
            <label>
              <input id="video360" type="checkbox" />
              生成 360° 视频
            </label>
          </div>
          <div class="row">
            <label>
              <input id="useDatasetCams" type="checkbox" checked />
              使用原训练/测试相机并插帧
            </label>
          </div>
          <div class="row">
            <label>插值帧数（每对相机）</label>
            <input id="interpPerPair" type="number" min="0" value="3" />
          </div>
          <div class="row">
            <label>FPS</label>
            <input id="fps" type="number" min="1" value="30" />
          </div>
          <div class="row">
            <label>训练轮数</label>
            <input id="iterations" type="number" min="1" value="30000" />
          </div>
        </section>

        <section class="card">
          <h2>Pose 渲染</h2>
          <div class="row">
            <label>
              <input id="poseEnable" type="checkbox" />
              指定 pose 渲染
            </label>
          </div>
          <div class="row">
            <label>Pose JSON 路径（服务器内）</label>
            <input id="posePath" type="text" placeholder="/workspace/tmp_fastgs/<session>/pose_xxx.json" />
          </div>
          <div class="row">
            <label>或上传 pose JSON</label>
            <input id="poseFile" type="file" accept=".json" />
            <button id="uploadPoseBtn">上传</button>
            <button id="renderPoseBtn">渲染Pose</button>
            <span id="poseUploadStatus" class="status"></span>
          </div>
        </section>

        <section class="card">
          <h2>模型与输出</h2>
          <div class="row">
            <label>
              <input id="includePly" type="checkbox" checked />
              下载模型点云
            </label>
            <label>
              <input id="includeVideo" type="checkbox" />
              下载360视频
            </label>
            <label>
              <input id="includePose" type="checkbox" />
              下载Pose渲染图
            </label>
          </div>
          <div class="row">
            <label>本地输出文件名</label>
            <input id="localOutputName" type="text" placeholder="fastgs_output.zip" />
          </div>
          <div class="row">
            <label>选择本地输出目录</label>
            <button id="pickOutputDirBtn">选择目录</button>
            <span id="outputDirStatus" class="status"></span>
          </div>
          <div class="row">
            <progress id="downloadProgress" value="0" max="100"></progress>
          </div>
        </section>

        <section class="card">
          <h2>运行与日志</h2>
          <div class="row">
            <button id="runBtn" class="primary">运行</button>
            <button id="downloadBtn">下载输出</button>
            <span id="elapsed">已用时间：00:00</span>
          </div>
          <div class="row">
            <span id="queueStatus" class="status">队列：待机</span>
            <span id="runStatus" class="status">状态：准备就绪</span>
          </div>
          <textarea id="logBox" readonly placeholder="日志输出..."></textarea>
        </section>
      </main>
    </div>

    <script>
      const OPEN_API = {
        base: "https://openapi.suanli.cn",
        version: "1.0.0",
        taskId: 1573688,
        servicePort: 8000,
        token: "f2ee1c4c-b678-4b3e-850b-e56a6f57bfd3-20260208093806",
        readyTimeoutMs: 5 * 60 * 1000,
      };

      const datasetZipInput = document.getElementById("datasetZip");
      const uploadDatasetBtn = document.getElementById("uploadDatasetBtn");
      const datasetUploadStatus = document.getElementById("datasetUploadStatus");
      const datasetProgress = document.getElementById("datasetProgress");
      const poseEnable = document.getElementById("poseEnable");
      const posePathInput = document.getElementById("posePath");
      const poseFileInput = document.getElementById("poseFile");
      const uploadPoseBtn = document.getElementById("uploadPoseBtn");
      const renderPoseBtn = document.getElementById("renderPoseBtn");
      const poseUploadStatus = document.getElementById("poseUploadStatus");
      const modelZipInput = document.getElementById("modelZip");
      const uploadModelBtn = document.getElementById("uploadModelBtn");
      const modelUploadStatus = document.getElementById("modelUploadStatus");
      const renderOnly = document.getElementById("renderOnly");
      const localOutputName = document.getElementById("localOutputName");
      const pickOutputDirBtn = document.getElementById("pickOutputDirBtn");
      const outputDirStatus = document.getElementById("outputDirStatus");
      const includePly = document.getElementById("includePly");
      const includeVideo = document.getElementById("includeVideo");
      const includePose = document.getElementById("includePose");
      const downloadProgress = document.getElementById("downloadProgress");
      const iterationsInput = document.getElementById("iterations");
      const video360 = document.getElementById("video360");
      const useDatasetCams = document.getElementById("useDatasetCams");
      const interpPerPair = document.getElementById("interpPerPair");
      const fpsInput = document.getElementById("fps");
      const runBtn = document.getElementById("runBtn");
      const downloadBtn = document.getElementById("downloadBtn");
      const logBox = document.getElementById("logBox");
      const elapsed = document.getElementById("elapsed");
      const queueStatus = document.getElementById("queueStatus");
      const runStatus = document.getElementById("runStatus");
      let runtimeApiBase = "";
      let sessionId = "";
      let outputDirHandle = null;
      let datasetUploading = false;
      let datasetUploaded = false;
      let logTimer = null;
      let elapsedTimer = null;
      let startTime = null;
      let currentRequestId = "";
      let cachedDownloadBlob = null;
      let cachedDownloadName = "";
      let backendReadyPromise = null;

      const sleep = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

      function appendLog(message) {
        logBox.value += `${message}\n`;
        logBox.scrollTop = logBox.scrollHeight;
      }

      function setRunStatus(text) {
        runStatus.textContent = `状态：${text}`;
      }

      function setQueueStatus(text) {
        queueStatus.textContent = `队列：${text}`;
      }

      function normalizeCode(code) {
        return String(code === undefined || code === null ? "" : code).trim().toLowerCase();
      }

      function isApiSuccess(payload) {
        if (!payload || typeof payload !== "object") {
          return false;
        }
        const code = normalizeCode(payload.code);
        return code === "0000" || code === "0" || code === "200" || code === "ok" || code === "success";
      }

      function extractPayloadMessage(payload) {
        if (!payload || typeof payload !== "object") {
          return "";
        }
        const message = payload.message || payload.msg || payload.detail || payload.error || "";
        if (typeof message === "string") {
          return message;
        }
        if (message && typeof message === "object") {
          return JSON.stringify(message);
        }
        return String(message || "");
      }

      function isRecoverAlreadyRunning(message) {
        return /already|running|active|运行中|已运行|无需恢复|未暂停|must.*paused|任务必须为暂停中/i.test(message || "");
      }

      function normalizeStatus(status) {
        return String(status === undefined || status === null ? "" : status).trim().toLowerCase();
      }

      function isRunningStatus(status) {
        return /running|ready|online|available|success|active|starting|recover|启动中|运行中|恢复中/.test(
          normalizeStatus(status)
        );
      }

      function extractTaskStatus(detailPayload) {
        const data = detailPayload && detailPayload.data;
        if (!data || typeof data !== "object") {
          return "";
        }
        return String(data.status || data.task_status || data.taskStatus || "").trim();
      }

      function normalizeBaseUrl(url) {
        if (typeof url !== "string") {
          return "";
        }
        const trimmed = url.trim();
        if (!trimmed) {
          return "";
        }
        return trimmed.replace(/\/$/, "");
      }

      function extractTaskServiceBaseUrls(detailPayload) {
        const data = detailPayload && detailPayload.data;
        if (!data || typeof data !== "object") {
          return [];
        }

        const services = Array.isArray(data.services) ? data.services : [];
        const preferred = [];
        const fallback = [];

        function pushUnique(target, value) {
          const base = normalizeBaseUrl(value);
          if (!base) {
            return;
          }
          if (!target.includes(base)) {
            target.push(base);
          }
        }

        for (const service of services) {
          const remotePorts = Array.isArray(service.remote_ports)
            ? service.remote_ports
            : (Array.isArray(service.remotePorts) ? service.remotePorts : []);

          pushUnique(fallback, service.url);
          pushUnique(fallback, service.service_url);
          pushUnique(fallback, service.serviceUrl);

          for (const portItem of remotePorts) {
            const url = normalizeBaseUrl(
              portItem.url || portItem.external_url || portItem.externalUrl || portItem.host_url || portItem.hostUrl
            );
            if (!url) {
              continue;
            }

            const servicePort = Number(
              portItem.service_port ?? portItem.servicePort ?? portItem.target_port ?? portItem.targetPort
            );
            if (Number.isFinite(servicePort) && servicePort === Number(OPEN_API.servicePort)) {
              pushUnique(preferred, url);
            } else {
              pushUnique(fallback, url);
            }
          }
        }

        return preferred.concat(fallback).filter((v, idx, arr) => arr.indexOf(v) === idx);
      }

      function extractTaskServiceBaseUrl(detailPayload) {
        const urls = extractTaskServiceBaseUrls(detailPayload);
        return urls[0] || "";
      }

      function getCurrentOriginBase() {
        if (!window.location || !/^https?:$/i.test(window.location.protocol)) {
          return "";
        }
        const origin = normalizeBaseUrl(window.location.origin);
        if (!origin || origin.includes("openapi.suanli.cn")) {
          return "";
        }
        return origin;
      }

      async function checkBackendHealth(base, timeoutMs = 6000) {
        const normalizedBase = normalizeBaseUrl(base);
        if (!normalizedBase) {
          return false;
        }
        const controller = new AbortController();
        const timer = window.setTimeout(() => controller.abort(), timeoutMs);
        try {
          const response = await fetch(`${normalizedBase}/health`, {
            cache: "no-store",
            signal: controller.signal,
          });
          return response.ok;
        } catch (error) {
          return false;
        } finally {
          window.clearTimeout(timer);
        }
      }

      function collectProbeBases(detailPayload) {
        const candidates = [];

        function pushUnique(base) {
          const normalized = normalizeBaseUrl(base);
          if (!normalized) {
            return;
          }
          if (!candidates.includes(normalized)) {
            candidates.push(normalized);
          }
        }

        pushUnique(runtimeApiBase);
        if (detailPayload) {
          for (const base of extractTaskServiceBaseUrls(detailPayload)) {
            pushUnique(base);
          }
        }
        pushUnique(getCurrentOriginBase());
        return candidates;
      }

      function buildOpenApiHeaders() {
        return {
          "Content-Type": "application/json",
          token: OPEN_API.token,
          timestamp: String(Date.now()),
          version: OPEN_API.version,
        };
      }

      function buildOpenApiGetHeaders() {
        return {
          token: OPEN_API.token,
          timestamp: String(Date.now()),
          version: OPEN_API.version,
        };
      }

      async function callTaskDetailApi() {
        const response = await fetch(
          `${OPEN_API.base}/api/deployment/task/detail?task_id=${encodeURIComponent(String(OPEN_API.taskId))}`,
          {
            method: "GET",
            headers: buildOpenApiGetHeaders(),
            cache: "no-store",
          }
        );

        let payload = null;
        try {
          payload = await response.json();
        } catch (error) {
          payload = null;
        }

        if (!response.ok) {
          const detail = extractPayloadMessage(payload) || `HTTP ${response.status}`;
          throw new Error(`detail 请求失败：${detail}`);
        }

        if (!isApiSuccess(payload)) {
          const message = extractPayloadMessage(payload) || `业务码 ${payload && payload.code ? payload.code : "unknown"}`;
          throw new Error(`detail 失败：${message}`);
        }

        return payload;
      }

      async function callTaskControlApi(action) {
        const actionPath = action === "recover" ? "recover" : "pause";
        const response = await fetch(`${OPEN_API.base}/api/deployment/task/${actionPath}`, {
          method: "POST",
          headers: buildOpenApiHeaders(),
          body: JSON.stringify({ task_id: OPEN_API.taskId }),
        });

        let payload = null;
        try {
          payload = await response.json();
        } catch (error) {
          payload = null;
        }

        if (!response.ok) {
          const detail = extractPayloadMessage(payload) || `HTTP ${response.status}`;
          throw new Error(`${actionPath} 请求失败：${detail}`);
        }

        if (!isApiSuccess(payload)) {
          const message = extractPayloadMessage(payload) || `业务码 ${payload && payload.code ? payload.code : "unknown"}`;
          if (action === "recover" && isRecoverAlreadyRunning(message)) {
            return payload;
          }
          throw new Error(`${actionPath} 失败：${message}`);
        }

        return payload;
      }

      async function waitForWorkerReady(timeoutMs = OPEN_API.readyTimeoutMs, intervalMs = 2000) {
        const deadline = Date.now() + timeoutMs;
        let lastStatus = "";
        let lastBase = "";
        let lastDetailError = "";
        while (Date.now() < deadline) {
          let detailPayload = null;
          try {
            detailPayload = await callTaskDetailApi();
            const status = extractTaskStatus(detailPayload);
            if (status) {
              lastStatus = status;
            }
          } catch (error) {
            lastDetailError = error && error.message ? error.message : String(error || "");
          }

          const probeBases = collectProbeBases(detailPayload);
          for (const baseToCheck of probeBases) {
            lastBase = baseToCheck;
            const healthy = await checkBackendHealth(baseToCheck);
            if (healthy) {
              runtimeApiBase = baseToCheck;
              return baseToCheck;
            }
          }
          await sleep(intervalMs);
        }
        const detailSuffix = lastDetailError ? `，detail错误：${lastDetailError}` : "";
        throw new Error(
          `任务恢复超时，后端尚未就绪。最后状态：${lastStatus || "unknown"}，最后地址：${lastBase || runtimeApiBase || "none"}${detailSuffix}`
        );
      }

      async function ensureBackendReady() {
        if (backendReadyPromise) {
          return backendReadyPromise;
        }

        backendReadyPromise = (async () => {
          setRunStatus("检查远程任务状态");
          let status = "";
          let detailOk = false;
          let recovered = false;

          try {
            const detail = await callTaskDetailApi();
            detailOk = true;
            status = extractTaskStatus(detail);
            const fromDetailBase = extractTaskServiceBaseUrl(detail);
            if (fromDetailBase) {
              runtimeApiBase = fromDetailBase;
            }
          } catch (error) {
            appendLog(`detail 检查失败，尝试直接探活后端：${error.message || error}`);
          }

          if (detailOk && !isRunningStatus(status)) {
            setRunStatus("任务未运行，执行恢复");
            await callTaskControlApi("recover");
            recovered = true;
          }

          const base = await waitForWorkerReady();
          return { base, recovered };
        })().finally(() => {
          backendReadyPromise = null;
        });

        return backendReadyPromise;
      }

      async function ensureSession(base) {
        if (sessionId) {
          return sessionId;
        }
        const res = await fetch(`${base}/create_session`, { method: "POST" });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || "创建会话失败");
        }
        sessionId = data.session_id || "";
        return sessionId;
      }

      function startLogPolling(base) {
        stopLogPolling();
        logTimer = setInterval(async () => {
          if (!sessionId) {
            return;
          }
          try {
            const res = await fetch(`${base}/logs?max_lines=300&session_id=${encodeURIComponent(sessionId)}`);
            const data = await res.json();
            if (data.log !== undefined) {
              logBox.value = data.log;
              logBox.scrollTop = logBox.scrollHeight;
            }
          } catch (err) {
            // ignore
          }
        }, 2000);
      }

      function stopLogPolling() {
        if (logTimer) {
          clearInterval(logTimer);
          logTimer = null;
        }
      }

      function startElapsed() {
        startTime = Date.now();
        if (elapsedTimer) {
          clearInterval(elapsedTimer);
        }
        elapsedTimer = setInterval(() => {
          const diff = Math.floor((Date.now() - startTime) / 1000);
          const mins = String(Math.floor(diff / 60)).padStart(2, "0");
          const secs = String(diff % 60).padStart(2, "0");
          elapsed.textContent = `已用时间：${mins}:${secs}`;
        }, 1000);
      }

      function stopElapsed() {
        if (elapsedTimer) {
          clearInterval(elapsedTimer);
          elapsedTimer = null;
        }
      }

      function applyQueueStatus(status) {
        if (!status) {
          return;
        }

        if (status.status === "processing" || status.position === 0) {
          setQueueStatus("处理中");
          return;
        }

        if (status.status === "pending") {
          const position = typeof status.position === "number" ? status.position : -1;
          if (position > 0) {
            const ahead = Math.max(0, position - 1);
            setQueueStatus(`排队中（前面还有 ${ahead} 个任务）`);
          } else {
            setQueueStatus("排队中");
          }
          return;
        }

        if (status.status === "completed") {
          setQueueStatus("已完成");
          return;
        }

        if (status.status === "failed") {
          setQueueStatus("失败");
          return;
        }

        setQueueStatus("待机");
      }

      function saveBlob(blob, filename) {
        if (outputDirHandle && window.showDirectoryPicker) {
          return outputDirHandle.getFileHandle(filename, { create: true }).then((fileHandle) =>
            fileHandle.createWritable().then((writable) => writable.write(blob).then(() => writable.close()))
          );
        }

        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
        return Promise.resolve();
      }

      function fetchDownloadBlob(base, sessionIdValue) {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("GET", `${base}/download_selected?session_id=${encodeURIComponent(sessionIdValue)}`);
          xhr.responseType = "blob";
          xhr.onprogress = (evt) => {
            if (evt.lengthComputable) {
              const percent = Math.round((evt.loaded / evt.total) * 100);
              downloadProgress.value = percent;
            }
          };
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              resolve(xhr.response);
              return;
            }
            reject(new Error(`下载失败: HTTP ${xhr.status}`));
          };
          xhr.onerror = () => reject(new Error("下载失败"));
          xhr.send();
        });
      }

      async function prefetchDownloadBlob(base) {
        const prepareRes = await fetch(`${base}/prepare_download`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            session_id: sessionId,
            include_ply: includePly.checked,
            include_video: includeVideo.checked,
            include_pose: includePose.checked,
          }),
        });

        const prepareData = await prepareRes.json();
        if (!prepareRes.ok) {
          throw new Error(prepareData.detail || "打包失败");
        }

        setRunStatus("打包中");
        let status = "packaging";
        for (let i = 0; i < 180; i += 1) {
          await sleep(2000);
          const statusRes = await fetch(`${base}/package_status?session_id=${encodeURIComponent(sessionId)}`);
          const statusData = await statusRes.json();
          status = statusData.status;
          if (status === "ready") {
            break;
          }
          if (status === "error") {
            throw new Error(statusData.error || "打包失败");
          }
        }

        if (status !== "ready") {
          throw new Error("打包超时，请稍后重试");
        }

        downloadProgress.value = 0;
        const blob = await fetchDownloadBlob(base, sessionId);
        const filename = (localOutputName.value || "fastgs_output.zip").trim() || "fastgs_output.zip";
        cachedDownloadBlob = blob;
        cachedDownloadName = filename;
        setRunStatus("输出已缓存，可下载");
      }

      async function maybePauseTaskIfIdle(reason = "") {
        try {
          const statusRes = await fetch(`${runtimeApiBase}/queue_status`, { cache: "no-store" });
          const queue = await statusRes.json();
          const hasPending = Number(queue.pending || 0) > 0;
          const hasProcessing = Boolean(queue.processing);
          if (hasPending || hasProcessing) {
            appendLog(`跳过暂停：队列仍有任务（${reason}）`);
            return;
          }

          await callTaskControlApi("pause");
          appendLog("任务已暂停。");
        } catch (error) {
          appendLog(`暂停任务失败: ${error.message}`);
        }
      }

      async function uploadDataset() {
        const file = datasetZipInput.files[0];
        if (!file) {
          datasetUploadStatus.textContent = "请选择 zip 文件";
          return;
        }

        datasetUploading = true;
        datasetUploaded = false;
        datasetUploadStatus.textContent = "上传中...";
        datasetProgress.value = 0;

        try {
          const ready = await ensureBackendReady();
          const base = ready.base;
          await ensureSession(base);

          const formData = new FormData();
          formData.append("file", file);
          formData.append("dataset_name", "dataset");
          formData.append("session_id", sessionId);

          await new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open("POST", `${base}/upload_dataset`);
            xhr.upload.onprogress = (evt) => {
              if (evt.lengthComputable) {
                const percent = Math.round((evt.loaded / evt.total) * 100);
                datasetProgress.value = percent;
              }
            };
            xhr.onload = () => {
              try {
                const data = JSON.parse(xhr.responseText || "{}");
                if (xhr.status >= 200 && xhr.status < 300) {
                  datasetUploadStatus.textContent = "上传成功";
                  datasetUploaded = true;
                  appendLog(`数据集上传完成: ${data.dataset_path || ""}`);
                  resolve();
                } else {
                  reject(new Error(data.detail || "上传失败"));
                }
              } catch (error) {
                reject(new Error("上传失败"));
              }
            };
            xhr.onerror = () => reject(new Error("上传失败"));
            xhr.send(formData);
          });
        } catch (error) {
          datasetUploadStatus.textContent = error.message || "上传失败";
          appendLog(`数据集上传失败: ${error.message}`);
        } finally {
          datasetUploading = false;
        }
      }

      async function uploadModel() {
        const file = modelZipInput.files[0];
        if (!file) {
          modelUploadStatus.textContent = "请选择 zip 文件";
          return;
        }

        modelUploadStatus.textContent = "上传中...";

        try {
          const ready = await ensureBackendReady();
          const base = ready.base;
          await ensureSession(base);

          const formData = new FormData();
          formData.append("file", file);
          formData.append("model_name", "model");
          formData.append("session_id", sessionId);

          const res = await fetch(`${base}/upload_model`, {
            method: "POST",
            body: formData,
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || "上传失败");
          }

          modelUploadStatus.textContent = "上传成功";
          renderOnly.checked = true;
          appendLog(`模型上传完成: ${data.model_path || ""}`);
        } catch (error) {
          modelUploadStatus.textContent = error.message || "上传失败";
          appendLog(`模型上传失败: ${error.message}`);
        }
      }

      async function uploadPose() {
        const file = poseFileInput.files[0];
        if (!file) {
          poseUploadStatus.textContent = "请选择 json 文件";
          return;
        }

        poseUploadStatus.textContent = "上传中...";

        try {
          const ready = await ensureBackendReady();
          const base = ready.base;
          await ensureSession(base);

          const formData = new FormData();
          formData.append("file", file);
          formData.append("session_id", sessionId);

          const res = await fetch(`${base}/upload_pose`, {
            method: "POST",
            body: formData,
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || "上传失败");
          }

          posePathInput.value = data.pose_path || "";
          poseUploadStatus.textContent = "上传成功";
          appendLog(`Pose 上传完成: ${posePathInput.value}`);
        } catch (error) {
          poseUploadStatus.textContent = error.message || "上传失败";
          appendLog(`Pose 上传失败: ${error.message}`);
        }
      }

      async function renderPose() {
        const posePath = posePathInput.value.trim();
        if (!posePath) {
          poseUploadStatus.textContent = "请先上传或填写 pose 路径";
          return;
        }

        try {
          const ready = await ensureBackendReady();
          const base = ready.base;
          await ensureSession(base);

          poseUploadStatus.textContent = "渲染中...";
          const res = await fetch(`${base}/render_pose_session`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              session_id: sessionId,
              pose_path: posePath,
            }),
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || "渲染失败");
          }

          poseUploadStatus.textContent = "渲染完成";
          appendLog(`Pose 渲染完成: ${data.pose_path || ""}`);
        } catch (error) {
          poseUploadStatus.textContent = error.message || "渲染失败";
          appendLog(`Pose 渲染失败: ${error.message}`);
        }
      }

      async function runTask() {
        if (datasetUploading) {
          appendLog("数据集上传中，请稍后...");
          return;
        }

        if (!datasetUploaded && !renderOnly.checked) {
          appendLog("请先上传数据集，或启用仅渲染模式。");
          return;
        }

        cachedDownloadBlob = null;
        cachedDownloadName = "";
        currentRequestId = "";

        let recoveredByThisRun = false;

        try {
          const ready = await ensureBackendReady();
          const base = ready.base;
          recoveredByThisRun = ready.recovered;
          await ensureSession(base);

          const requestId = (window.crypto && window.crypto.randomUUID)
            ? window.crypto.randomUUID()
            : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
          currentRequestId = requestId;

          const payload = {
            source_path: "",
            model_path: "",
            iterations: Number(iterationsInput.value || 30000),
            mult: 0.5,
            white_background: false,
            eval: false,
            data_device: "cuda",
            iteration: -1,
            video360: video360.checked,
            use_dataset_cams: useDatasetCams.checked,
            use_test_cams: false,
            interp_per_pair: Number(interpPerPair.value || 3),
            loop: false,
            fps: Number(fpsInput.value || 30),
            pose_path: poseEnable.checked ? posePathInput.value.trim() : "",
            frames: 240,
            ease: true,
            render_only: renderOnly.checked,
            session_id: sessionId,
            request_id: requestId,
          };

          setRunStatus("任务已提交");
          setQueueStatus("排队状态查询中");
          startLogPolling(base);
          startElapsed();

          const runRes = await fetch(`${base}/run`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const runData = await runRes.json();
          if (!runRes.ok) {
            throw new Error(runData.detail || "任务提交失败");
          }

          let done = false;
          while (!done) {
            const qRes = await fetch(`${base}/queue_status?request_id=${encodeURIComponent(requestId)}`, {
              cache: "no-store",
            });
            const qData = await qRes.json();
            applyQueueStatus(qData);

            const sRes = await fetch(`${base}/request_status?request_id=${encodeURIComponent(requestId)}`, {
              cache: "no-store",
            });
            const sData = await sRes.json();
            if (!sRes.ok) {
              throw new Error(sData.detail || "读取任务状态失败");
            }

            if (sData.status === "completed") {
              done = true;
              setRunStatus("任务完成，正在预打包下载");
              break;
            }

            if (sData.status === "failed") {
              throw new Error(sData.error || "任务失败");
            }

            await sleep(2000);
          }

          await prefetchDownloadBlob(base);
          await maybePauseTaskIfIdle("运行完成");
          setRunStatus("完成");
          appendLog("任务完成。可点击“下载输出”保存文件。");
        } catch (error) {
          setRunStatus(`失败: ${error.message}`);
          appendLog(`运行失败: ${error.message}`);
          if (recoveredByThisRun && runtimeApiBase) {
            await maybePauseTaskIfIdle("失败兜底");
          }
        } finally {
          stopElapsed();
          stopLogPolling();
        }
      }

      async function downloadOutput() {
        const filename = (localOutputName.value || "fastgs_output.zip").trim() || "fastgs_output.zip";

        try {
          if (cachedDownloadBlob) {
            await saveBlob(cachedDownloadBlob, filename || cachedDownloadName || "fastgs_output.zip");
            appendLog("已从前端缓存下载输出。\n");
            return;
          }

          const ready = await ensureBackendReady();
          const base = ready.base;
          await ensureSession(base);

          await prefetchDownloadBlob(base);
          if (!cachedDownloadBlob) {
            throw new Error("输出缓存失败");
          }

          await saveBlob(cachedDownloadBlob, filename);
          appendLog("下载完成。");

          if (ready.recovered) {
            await maybePauseTaskIfIdle("下载完成");
          }
        } catch (error) {
          appendLog(`下载失败: ${error.message}`);
        }
      }

      uploadDatasetBtn.addEventListener("click", uploadDataset);
      uploadModelBtn.addEventListener("click", uploadModel);
      uploadPoseBtn.addEventListener("click", uploadPose);
      renderPoseBtn.addEventListener("click", renderPose);
      runBtn.addEventListener("click", runTask);
      downloadBtn.addEventListener("click", downloadOutput);

      pickOutputDirBtn.addEventListener("click", async () => {
        if (window.showDirectoryPicker) {
          outputDirHandle = await window.showDirectoryPicker();
          outputDirStatus.textContent = "已选择输出目录";
        } else {
          outputDirStatus.textContent = "浏览器不支持目录选择";
        }
      });

      window.addEventListener("beforeunload", () => {
        if (!sessionId || !runtimeApiBase) {
          return;
        }
        const formData = new FormData();
        formData.append("session_id", sessionId);
        navigator.sendBeacon(`${runtimeApiBase}/cleanup`, formData);
      });

      setRunStatus("准备就绪");
      setQueueStatus("待机");
      appendLog("页面初始化完成。点击上传或运行时将自动恢复远端任务。");
    </script>
  </body>
</html>
